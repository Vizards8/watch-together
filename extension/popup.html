<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 13px;
      color: #222;
    }
    h1 { font-size: 15px; margin: 0; }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .head a {
      font-size: 12px;
      color: #fb7299;
      text-decoration: none;
      white-space: nowrap;
    }
    .head a:hover { text-decoration: underline; }
    label { display: block; margin: 8px 0 3px; color: #666; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #fb7299;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.leave { background: #999; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      background: #f5f5f5;
      font-size: 12px;
      color: #555;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 5px; }
    .dot.on { background: #34c759; }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #999;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="head">
    <h1>一起看 🎬</h1>
    <a id="helpLink" href="help.html" target="_blank">怎么用？</a>
  </div>

  <label>你的昵称</label>
  <input id="nick" placeholder="大家会看到这个名字" maxlength="12" />

  <label>房间号（和大家说好同一个）</label>
  <input id="room" placeholder="例如 我俩的小屋" />

  <label>房间密码（和大家说好同一个）</label>
  <input id="pass" type="password" placeholder="留空则无密码" />

  <button id="joinBtn">加入房间</button>

  <details style="margin-top:10px">
    <summary style="cursor:pointer;color:#999;font-size:12px">高级设置</summary>
    <label>中转服务地址（留空用默认）</label>
    <input id="serverUrl" placeholder="wss://xxx.workers.dev" />
  </details>
  <button id="leaveBtn" class="leave" style="display:none">离开</button>

  <div class="status">
    <span class="dot" id="dot"></span><span id="statusText">未连接</span>
  </div>

  <!-- 聊天在页面上的悬浮面板里进行，不必再开插件弹窗，所以这里不放输入框 -->
  <div id="chatHint" class="hint" style="display:none">
    💬 想说话就在视频页的小面板里直接打字
  </div>

  <script src="popup.js"></script>
</body>
</html>
