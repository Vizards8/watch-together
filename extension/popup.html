<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "PingFang SC", sans-serif;
      font-size: 13px;
      color: #222;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; margin: 8px 0 3px; color: #666; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #fb7299;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button.leave { background: #999; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      background: #f5f5f5;
      font-size: 12px;
      color: #555;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 5px; }
    .dot.on { background: #34c759; }
    .chat-row { display: flex; gap: 6px; margin-top: 8px; }
    .chat-row input { flex: 1; }
    .chat-row button { width: 60px; margin-top: 0; }
  </style>
</head>
<body>
  <h1>一起看 🎬</h1>

  <label>中转服务地址</label>
  <input id="serverUrl" placeholder="wss://xxx.up.railway.app" />

  <label>房间号（和对方约定一致）</label>
  <input id="room" placeholder="例如 我俩的小屋" />

  <label>房间密码（和对方约定一致）</label>
  <input id="pass" type="password" placeholder="留空则无密码" />

  <button id="joinBtn">加入房间</button>
  <button id="leaveBtn" class="leave" style="display:none">离开</button>

  <div class="status">
    <span class="dot" id="dot"></span><span id="statusText">未连接</span>
  </div>

  <div class="chat-row" id="chatRow" style="display:none">
    <input id="chatInput" placeholder="发一句话给对方" />
    <button id="chatBtn">发送</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
